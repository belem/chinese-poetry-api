# 同步按钮：只在 develop 分支显示，权限沿用仓库写权限
branch:
  - reg: ^develop$
    buttons:
      - name: 同步 GitHub
        description: 和 belem/chinese-poetry-api 的 develop 对齐（先拉后推）
        event: web_trigger_sync
        isDefault: true
        inputs:
          MODE:
            name: 同步方向
            type: select
            default: both
            options:
              - name: 先拉后推
                value: both
              - name: CNB → GitHub
                value: push
              - name: GitHub → CNB
                value: pull
